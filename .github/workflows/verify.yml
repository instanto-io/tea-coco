name: Verify and publish TeaCoCo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  # Required to publish SpotBugs SARIF to code scanning.
  security-events: write
concurrency:
  group: teacoco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven artifacts and independent consumers against upstream TeaVM and real Chrome
        run: mvn -B -ntp -s central-settings.xml clean install
      - name: Verify Gradle plugin and consumer integrations
        run: ./gradlew --no-daemon check publishToMavenLocal
      - name: SonarQube analysis
        # The Maven reactor carries the Maven plugin; the Gradle plugin is
        # verified separately but is not part of this analysis.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonar.instanto.io
        run: >-
          mvn --settings central-settings.xml --batch-mode --no-transfer-progress
          sonar:sonar -Dsonar.projectKey=teacoco -Dsonar.projectName=teacoco
          -Dsonar.qualitygate.wait=true
      - name: Collect SpotBugs SARIF
        if: always()
        run: |
          rm -rf target/spotbugs-reports
          mkdir -p target/spotbugs-reports
          find . -path '*/target/spotbugs/*.sarif' -exec cp {} target/spotbugs-reports/ \;
      - name: Upload SpotBugs SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/spotbugs-reports
          category: spotbugs
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
  publish-snapshot:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # packages.instanto.io is private-network infrastructure, reachable by this pool.
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 45
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
    steps:
      - name: Allocate job-local Gradle cache
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/teacoco-gradle-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Publish verified snapshots to Instanto
        run: |
          set -euo pipefail
          if [ -z "$FORGEJO_PACKAGE_USER" ] || [ -z "$FORGEJO_PACKAGE_TOKEN" ]; then
            echo '::error::Grant instanto-io/tea-coco access to the organisation Forgejo package user and write-token secrets.'
            exit 1
          fi
          # Both adapters and consumers were verified at this workflow's checkout.
          # Keep deployments out of the shared runner's persistent Maven cache.
          mvn -B -ntp -s .github/maven-settings.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}" \
            -pl coverage,maven-plugin -am clean deploy -DskipTests
          ./gradlew --no-daemon publish
      - name: Clean job-local package caches
        if: always()
        run: |
          rm -rf -- "$GRADLE_USER_HOME" \
            "$RUNNER_TEMP/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}"
  mockatcha-example:
    needs: publish-snapshot
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mockatcha-example
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Allocate isolated Maven cache
        run: echo "DEMO_MAVEN_CACHE=$RUNNER_TEMP/mockatcha-demo-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Verify snapshots with JVM and browser tests
        run: |
          mvn -B -ntp -U -s settings.xml -Dmaven.repo.local="$DEMO_MAVEN_CACHE" clean verify
          cat target/coverage-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage diagnostics
        if: always()
        run: |
          python3 .github/scripts/publish_report.py --name timesheet-coverage \
            --path target/site --path target/surefire-reports --path target/failsafe-reports \
            --path target/teavm-coverage.xml --path target/teavm-coverage.xml.exec \
            --path target/browser-coverage.xml --path target/compiler-evidence.json \
            --path target/coverage-comparison.md
      - name: Clean isolated Maven cache
        if: always()
        run: rm -rf -- "$DEMO_MAVEN_CACHE"
