name: Verify standalone coverage
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against public upstream artifacts and real Chrome
        run: mvn -B -ntp -s central-settings.xml clean install
      - name: Verify an unrelated consumer without this reactor parent
        run: python3 scripts/smoke_consumer.py
