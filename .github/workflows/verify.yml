name: Verify and publish tea-coco
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tea-coco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven artifacts against upstream TeaVM and real Chrome
        run: mvn -B -ntp -s central-settings.xml clean install
      - name: Verify an unrelated Maven consumer
        run: python3 scripts/smoke_consumer.py
      - name: Verify Gradle plugin and install plugin markers locally
        run: ./gradlew --no-daemon check publishToMavenLocal
      - name: Verify upstream TeaVM Gradle library and application consumers
        run: python3 scripts/smoke_gradle_consumer.py
      - name: Publish verified snapshots to Instanto
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FORGEJO_PACKAGE_USER" ] || [ -z "$FORGEJO_PACKAGE_TOKEN" ]; then
            echo '::error::Grant instanto-io/tea-coco access to the organisation Forgejo package user and write-token secrets.'
            exit 1
          fi
          # The complete reactor and both consumers were verified above at this commit.
          # The example is not a published library and its coverage report needs real tests.
          mvn -B -ntp -s .github/maven-settings.xml -pl coverage,maven-plugin -am deploy -DskipTests
          ./gradlew --no-daemon publish
      - name: Verify published Maven and Gradle snapshots from fresh caches
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/smoke_consumer.py --settings .github/maven-settings.xml \
            --local-repository "$RUNNER_TEMP/tea-coco-published-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 scripts/smoke_gradle_consumer.py --published
