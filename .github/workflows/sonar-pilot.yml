name: Verify JaCoCo browser coverage import in Sonar
on:
  workflow_dispatch:
    inputs:
      verify_readback:
        description: Verify server counters through the API (requires read access)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sonar-import:
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: https://sonar.instanto.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_READ_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check existing analysis access
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::The existing organisation SONAR_TOKEN must be available to TeaCoCo.'
            exit 1
          fi
      - name: Verify stock runner and install the tested reactor
        run: mvn -B -ntp -s central-settings.xml -pl jacoco-example -am clean install
      - name: Analyze the isolated coverage fixture
        run: |
          mvn -B -ntp -s central-settings.xml -f jacoco-example/pom.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=teacoco-jacoco-pilot \
            '-Dsonar.projectName=TeaCoCo coverage pilot' \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/teavm-coverage.xml
      - name: Verify imported counters, coverage calculation and gate status
        if: inputs.verify_readback
        run: python3 scripts/check_sonar_import.py
      - name: Link results for manual browser verification
        if: ${{ !inputs.verify_readback }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Analysis was submitted. Verify the processed counters and quality gate in the
          [Sonar pilot dashboard](https://sonar.instanto.io/dashboard?id=teacoco-jacoco-pilot).

          API readback was not requested. A successful workflow confirms build and analysis
          submission; it does not assert server-side coverage counters or quality gate status.
          SUMMARY
